<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火锅应用程序</title>
    <style>
        body {font-family: "Microsoft YaHei", sans-serif; background: #fff5f0; margin: 0; color: #333;}
        header {background: #d32f2f; color: white; text-align: center; padding: 40px 20px;}
        header h1 {margin: 0; font-size: 36px;}
        .container {max-width: 800px; margin: 20px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);}
        h2 {color: #d32f2f; border-bottom: 2px solid #ffcdd2; padding-bottom: 10px;}
        .menu-item {display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px dashed #eee;}
        .item-name {font-weight: bold; font-size: 18px;}
        .item-desc {color: #777; font-size: 14px; margin-top: 5px;}
        .item-price {color: #d32f2f; font-weight: bold; font-size: 18px;}
    </style>
</head>
<body>
    <header>
        <h1>🔥 火锅应用程序 🔥</h1>
        <p>正宗好味道，麻辣鲜香</p>
    </header>
    <div class="container">
        <h2>招牌锅底</h2>
        <div class="menu-item">
            <div><div class="item-name">经典牛油红汤锅</div><div class="item-desc">麻辣醇厚</div></div>
            <div class="item-price">¥68</div>
        </div>
        <div class="menu-item">
            <div><div class="item-name">大骨浓汤鸳鸯锅</div><div class="item-desc">一半红汤一半清汤</div></div>
            <div class="item-price">¥78</div>
        </div>
        <h2>必点鲜菜</h2>
        <div class="menu-item">
            <div><div class="item-name">鲜切毛肚</div><div class="item-desc">七上八下，脆嫩</div></div>
            <div class="item-price">¥48</div>
        </div>
        <div class="menu-item">
            <div><div class="item-name">手打鲜虾滑</div><div class="item-desc">Q弹鲜美</div></div>
            <div class="item-price">¥38</div>
        </div>
    </div>
</body>
</html>
